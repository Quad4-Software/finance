# Default values for quad4.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  # The public domain of the application (e.g., quad4.local, app.quad4.com)
  domain: "quad4.local"
  # Set to true if the application is accessed over HTTPS (changes generated URLs)
  tls: false

  # For production, we recommend passing existingSecret instead of creating one via Helm values
  # existingSecret: "quad4-secrets"

# If existingSecret is NOT set, this secret will be created with the values below
secret:
  # MUST change in production
  secretKey: "dev-secret-change-in-production"
  # If postgresql.enabled is true, the internal database will be deployed.
  # If postgresql.enabled is false, you must provide your external database URL here or in existingSecret.
  databaseUrl: 'postgresql+asyncpg://postgres:postgres@{{ include "quad4.fullname" . }}-postgresql:5432/quad4'

  # Enable Banking
  enableBankingAppId: ""
  enableBankingPrivateKey: "" # Content of the PEM file

  # OIDC
  oidcClientId: ""
  oidcClientSecret: ""

  # OpenExchangeRates
  openexchangeratesAppId: ""

  # S3 storage (optional; used when config.storageProvider is "s3")
  storageS3AccessKey: ""
  storageS3SecretKey: ""

  # Key for the AES-256 scheduled backup archives. Empty derives one from
  # secretKey; set a stable dedicated key to survive SECRET_KEY rotation.
  backupEncryptionKey: ""

  # Agents (LLM)
  agentsMcpJwtSecret: "dev-mcp-secret-change-in-production"
  agentsOpenaiApiKey: ""
  agentsAnthropicApiKey: ""
  agentsOpenaiCompatApiKey: ""

# Non-sensitive configuration
config:
  debug: "false"
  # Set false only when oidc.enabled, oidc.clientId, and oidc.discoveryUrl are configured.
  localAuthEnabled: "true"
  enableBankingApiUrl: "https://api.enablebanking.com"
  # Leave empty to auto-compute from global.domain
  enableBankingOauthRedirectUri: ""
  simplefinEnabled: "false"
  simplefinApiUrl: "https://beta-bridge.simplefin.org"
  oidcEnabled: "false"
  oidcProviderName: "OIDC"
  oidcDiscoveryUrl: ""
  oidcRedirectUri: ""
  oidcScopes: "openid email profile"
  oidcAutoRegister: "true"
  # Link OIDC logins to existing accounts with the same email: disabled, verified_email, or email
  oidcExistingUserLinkMode: "disabled"
  oidcRequireVerifiedEmail: "true"
  oidcSyncRoles: "false"
  oidcRolesClaim: "groups"
  oidcAdminRoles: ""
  oidcWorkspaceRoleMap: ""
  fxSyncMode: "on_demand"

  # Kernel sandboxing (Landlock + seccomp). No-op on kernels without support.
  sandboxEnabled: "true"
  sandboxLandlockEnabled: "true"
  sandboxSeccompEnabled: "true"

  # Storage: "local" or "s3". S3 credentials live under secret.storageS3*.
  storageProvider: "local"
  storageS3Bucket: ""
  storageS3Region: ""
  storageS3EndpointUrl: ""

  # Scheduled encrypted backups
  backupLocalPath: "/app/data/backups"
  backupRetentionCount: "14"
  backupScheduleHour: "3"

  # Redis configuration
  # If redis.enabled is true, the internal redis will be deployed.
  # If redis.enabled is false, you must provide your external Redis URL here.
  redisUrl: 'redis://{{ include "quad4.fullname" . }}-redis-master:6379/0'
  celeryBrokerUrl: 'redis://{{ include "quad4.fullname" . }}-redis-master:6379/0'
  celeryResultBackend: 'redis://{{ include "quad4.fullname" . }}-redis-master:6379/0'

  storageLocalPath: "/app/data/attachments"
  agentsKnowledgeStoragePath: "/app/data/agent_knowledge"

  # Agents feature
  agentsEnabled: "false"
  agentsBuiltinMcpUrl: 'http://{{ include "quad4.fullname" . }}-mcp-server:8765/mcp'
  agentsExternalMcpUrl: '{{ include "quad4.frontendUrl" . }}/mcp'
  agentsExtraMcpServers: ""
  agentsMcpExternalTtlDays: "90"
  agentsDefaultProvider: "ollama"
  agentsDefaultModel: ""
  agentsOllamaBaseUrl: "http://ollama:11434"
  agentsOpenaiCompatBaseUrl: ""
  agentsEmbeddingProvider: "native"
  agentsEmbeddingModel: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"

# Backend configuration
backend:
  replicaCount: 1
  image:
    repository: ghcr.io/quad4-software/quad4-backend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

# Frontend configuration
frontend:
  backendUrl: ""
  replicaCount: 1
  image:
    repository: ghcr.io/quad4-software/quad4-frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

# Celery Worker configuration
celeryWorker:
  enabled: true
  replicaCount: 1
  image:
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

# Celery Beat configuration
celeryBeat:
  enabled: true
  image:
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

# Built-in MCP Server configuration
mcpServer:
  enabled: false
  replicaCount: 1
  image:
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8765
  resources:
    limits:
      cpu: 300m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi

# Persistence for application data
# IMPORTANT: Since Backend, Celery Worker, and MCP Server all share the same attachment files,
# they mount these PVCs concurrently. If your pods are scheduled across multiple nodes,
# you MUST use a StorageClass that supports `ReadWriteMany` (RWX) access mode (e.g., NFS, CephFS).
# `ReadWriteOnce` will only work if you restrict all pods to a single node.
persistence:
  attachments:
    enabled: true
    size: 5Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  # Holds the scheduled AES-256 encrypted backup archives when
  # config.storageProvider is "local".
  backups:
    enabled: true
    size: 2Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  # Both agent volumes are created only when config.agentsEnabled is true,
  # so leaving these on costs a workspace that never enabled agents nothing,
  # and a workspace that did keeps the volume it already has across upgrades.
  agentKnowledge:
    enabled: true
    size: 5Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  agentEmbeddingModels:
    enabled: true
    size: 5Gi
    storageClass: ""
    accessMode: ReadWriteOnce

# Standard Kubernetes Ingress
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  tls: []
  #  - secretName: quad4-tls
  #    hosts:
  #      - quad4.local

httpRoute:
  enabled: false
  parentRefs: []
  # - name: external-gateway
  #   namespace: gateway-system
  # Path matches will route /api to backend and / to frontend.

# Simple StatefulSet for PostgreSQL
postgresql:
  enabled: true
  image:
    repository: docker.io/pgvector/pgvector
    tag: pg16
    pullPolicy: IfNotPresent
  resources: {}

# Simple StatefulSet for Redis
redis:
  enabled: true
  image:
    repository: docker.io/library/redis
    tag: 8-alpine
    pullPolicy: IfNotPresent
  resources: {}

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80
