name: Zizmor

on:
  push:
    branches: [main]
    paths: [.github/workflows/**]
  pull_request:
    branches: [main]
    paths: [.github/workflows/**]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  zizmor:
    name: Workflow static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false
