# Quad4 Finance frontend - Chainguard nginx server block.
# Dropped into /etc/nginx/conf.d/default.conf by the Dockerfile; the stock
# main nginx.conf already runs nginx as the nginx user on port 8080.
#
# The API upstream is the compose service name "backend". Runtime
# re-resolution goes through Docker's embedded DNS so a recreated backend
# container does not leave nginx proxying to a dead IP. On platforms with a
# different resolver (Kubernetes, Railway) mount a replacement conf.d file.
server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Hide the version string on error pages and Server headers.
    server_tokens off;

    # Security headers for the SPA shell.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    location /api/ {
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $upstream http://backend:8000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Connecting a bank imports its whole history in this one request; a
    # SimpleFIN link with several institutions can take well over nginx's
    # default 60s read timeout.
    location = /api/connections/oauth/callback {
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $upstream http://backend:8000;
        proxy_pass $upstream;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Never cache index.html so new deployments are picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Long cache for fingerprinted build assets.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback - serve index.html for all non-file routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
