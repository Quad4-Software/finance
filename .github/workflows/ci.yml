name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Only superseded PR runs are cancelled; every main push is validated.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    # PostgreSQL starts on skipped PRs too; split setup if that cost dominates.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: quad4_test
          POSTGRES_PASSWORD: quad4_test
          POSTGRES_DB: quad4_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U quad4_test -d quad4_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Detect backend-relevant changes
        id: backend-changes
        working-directory: .
        run: python3 .github/ci/changes.py

      - name: Skip backend tests
        if: steps.backend-changes.outputs.run_backend == 'false'
        run: echo "No backend-relevant changes; skipping backend test suite."

      - name: Set up Python
        if: steps.backend-changes.outputs.run_backend != 'false'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Single source of truth with the Docker image: CI must test the
          # same interpreter the backend ships with.
          python-version-file: backend/.python-version

      - name: Set up uv
        if: steps.backend-changes.outputs.run_backend != 'false'
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: |
            backend/uv.lock
            backend/pyproject.toml
            backend/.python-version

      - name: Install dependencies
        if: steps.backend-changes.outputs.run_backend != 'false'
        run: uv sync --locked --all-extras

      - name: Lint with Ruff
        if: steps.backend-changes.outputs.run_backend != 'false'
        run: uv run --no-sync ruff check .

      - name: Type check with ty
        if: steps.backend-changes.outputs.run_backend != 'false'
        run: uv run --no-sync ty check .

      - name: Run tests with coverage
        if: steps.backend-changes.outputs.run_backend != 'false'
        env:
          POSTGRES_TEST_URL: postgresql+asyncpg://quad4_test:quad4_test@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/quad4_test
          # The sandbox self-tests would sandbox the pytest process; disable.
          SANDBOX_ENABLED: "false"
        run: |
          uv run --no-sync pytest -n auto --dist loadfile --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=60 -ra -W error

      - name: Upload coverage report
        if: ${{ always() && steps.backend-changes.outputs.run_backend != 'false' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: backend/coverage.xml

  migration-chain:
    name: Migration Chain
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      # No `ref:` override, so on a pull request this is the merge with the
      # base branch. That is the whole point: a revision id that only clashes
      # once both sides are together is visible here and nowhere else.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test CI change selection
        run: python3 .github/ci/test_changes.py

      - name: Check the Alembic revision chain
        run: python3 backend/scripts/check_migration_chain.py

  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Detect frontend-relevant changes
        id: frontend-changes
        working-directory: .
        run: python3 .github/ci/changes.py

      - name: Skip frontend checks
        if: steps.frontend-changes.outputs.run_frontend == 'false'
        run: echo "No frontend-relevant changes; skipping frontend checks."

      - name: Set up Node.js
        if: steps.frontend-changes.outputs.run_frontend != 'false'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.frontend-changes.outputs.run_frontend != 'false'
        run: npm ci

      - name: Lint
        if: steps.frontend-changes.outputs.run_frontend != 'false'
        run: npm run lint -- --max-warnings=0

      - name: Type check & Build
        if: steps.frontend-changes.outputs.run_frontend != 'false'
        run: npm run build

      - name: Run tests
        if: steps.frontend-changes.outputs.run_frontend != 'false'
        run: npm test

  helm-checks:
    name: Helm Checks
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Detect helm-relevant changes
        id: helm-changes
        run: python3 .github/ci/changes.py

      - name: Skip helm checks
        if: steps.helm-changes.outputs.run_helm == 'false'
        run: echo "No helm-relevant changes; skipping helm lint."

      - name: Set up Helm
        if: steps.helm-changes.outputs.run_helm != 'false'
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0

      - name: Lint Helm Chart
        if: steps.helm-changes.outputs.run_helm != 'false'
        run: |
          helm lint charts/quad4
          helm template quad4-test charts/quad4 > /dev/null

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build backend image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
